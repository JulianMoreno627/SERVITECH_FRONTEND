<div class="min-h-screen bg-slate-50 flex items-center justify-center p-6 relative overflow-hidden font-['Plus_Jakarta_Sans']">
  <!-- Decorative Blobs -->
  <div class="absolute top-0 -left-4 w-96 h-96 bg-blue-400 rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-blob"></div>
  <div class="absolute top-0 -right-4 w-96 h-96 bg-indigo-400 rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-blob animation-delay-2000"></div>
  <div class="absolute -bottom-8 left-20 w-96 h-96 bg-purple-400 rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-blob animation-delay-4000"></div>

  <div class="max-w-xl w-full relative group">
    <!-- Card Glow -->
    <div class="absolute -inset-1 bg-gradient-to-r from-blue-600 to-indigo-600 rounded-3xl blur opacity-25 group-hover:opacity-40 transition duration-1000 group-hover:duration-200"></div>
    
    <div class="relative bg-white/80 backdrop-blur-xl border border-white/20 p-10 rounded-3xl shadow-2xl">
      <div class="text-center mb-10">
        <div class="inline-flex items-center justify-center w-20 h-20 bg-gradient-to-tr from-blue-600 to-indigo-600 rounded-2xl shadow-xl shadow-blue-500/30 mb-6 transform transition-transform group-hover:scale-110 duration-500">
          <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" class="text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z" />
          </svg>
        </div>
        <h1 class="text-4xl font-black text-slate-900 tracking-tight mb-2 bg-clip-text text-transparent bg-gradient-to-r from-blue-600 to-indigo-600">Crear Cuenta</h1>
        <p class="text-slate-500 font-medium">Únete a la red técnica más grande</p>
      </div>

      <form class="space-y-6" [formGroup]="registerForm" (ngSubmit)="onSubmit()">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div class="space-y-5 col-span-1 md:col-span-2">
            <div>
              <label for="nombre" class="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-2 ml-1">Nombre Completo</label>
              <div class="relative group/input">
                <input 
                  formControlName="nombre"
                  type="text" 
                  id="nombre" 
                  class="block w-full px-6 py-4 bg-slate-50 border border-slate-200 rounded-2xl text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition-all duration-300 font-medium"
                  placeholder="Juan Pérez">
              </div>
            </div>
          </div>

          <div class="space-y-5">
            <div>
              <label for="email" class="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-2 ml-1">Email</label>
              <div class="relative group/input">
                <input 
                  formControlName="email"
                  type="email" 
                  id="email" 
                  class="block w-full px-6 py-4 bg-slate-50 border border-slate-200 rounded-2xl text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition-all duration-300 font-medium"
                  placeholder="juan@servitech.com">
              </div>
            </div>

            <div>
              <label for="direccion" class="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-2 ml-1">Dirección</label>
              <div class="relative group/input">
                <input 
                  formControlName="direccion"
                  type="text" 
                  id="direccion" 
                  class="block w-full px-6 py-4 bg-slate-50 border border-slate-200 rounded-2xl text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition-all duration-300 font-medium"
                  placeholder="Calle 123 #45-67">
              </div>
            </div>

            <div>
              <label for="usuario" class="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-2 ml-1">Usuario</label>
              <div class="relative group/input">
                <input 
                  formControlName="usuario"
                  type="text" 
                  id="usuario" 
                  class="block w-full px-6 py-4 bg-slate-50 border border-slate-200 rounded-2xl text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition-all duration-300 font-medium"
                  placeholder="jperez_tech">
              </div>
            </div>
          </div>

          <div class="space-y-5">
            <div>
              <label for="telefono" class="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-2 ml-1">Teléfono</label>
              <div class="relative group/input">
                <input 
                  formControlName="telefono"
                  type="text" 
                  id="telefono" 
                  class="block w-full px-6 py-4 bg-slate-50 border border-slate-200 rounded-2xl text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition-all duration-300 font-medium"
                  placeholder="300 123 4567">
              </div>
            </div>

            <div>
              <label for="contrasena" class="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-2 ml-1">Contraseña</label>
              <div class="relative group/input">
                <input 
                  formControlName="contrasena"
                  type="password" 
                  id="contrasena" 
                  class="block w-full px-6 py-4 bg-slate-50 border border-slate-200 rounded-2xl text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition-all duration-300 font-medium"
                  placeholder="••••••••••••">
              </div>
            </div>

            <div>
              <label class="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-2 ml-1">Rol de Acceso</label>
              <div class="relative group/input">
                <select 
                  formControlName="rol"
                  class="block w-full px-6 py-4 bg-slate-50 border border-slate-200 rounded-2xl text-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition-all duration-300 font-bold appearance-none">
                  <option value="CLIENTE">Cliente / Usuario</option>
                  <option value="TECNICO">Técnico Especialista</option>
                </select>
                <div class="absolute inset-y-0 right-0 pr-4 flex items-center pointer-events-none text-slate-400">
                  <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                  </svg>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div *ngIf="error" class="bg-rose-50 border border-rose-100 p-4 rounded-2xl flex items-center space-x-3">
          <svg class="h-5 w-5 text-rose-500 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd" />
          </svg>
          <p class="text-sm font-bold text-rose-700">{{ error }}</p>
        </div>

        <button 
          type="submit" 
          [disabled]="registerForm.invalid" 
          class="relative w-full group/btn overflow-hidden py-4 px-6 rounded-2xl bg-slate-900 text-white font-bold transition-all duration-300 hover:shadow-2xl hover:shadow-blue-500/20 disabled:opacity-50 disabled:cursor-not-allowed transform active:scale-[0.98]">
          <div class="absolute inset-0 w-full h-full bg-gradient-to-r from-blue-600 to-indigo-600 opacity-0 group-hover/btn:opacity-100 transition-opacity duration-300"></div>
          <span class="relative flex items-center justify-center space-x-2">
            <span>Comenzar ahora</span>
            <svg class="w-5 h-5 group-hover/btn:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6" />
            </svg>
          </span>
        </button>

        <div class="text-center pt-2">
          <p class="text-sm font-medium text-slate-500">
            ¿Ya tienes una cuenta? 
            <a routerLink="/login" class="text-blue-600 font-bold hover:text-blue-700 transition-colors ml-1 border-b-2 border-transparent hover:border-blue-200">Inicia sesión aquí</a>
          </p>
        </div>
      </form>
    </div>
  </div>
</div>
